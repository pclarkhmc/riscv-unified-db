# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SDTRIG_MCONTROL6_EXECUTE_LEGAL_VALUES
description: |
  The set of values that mcontrol6.EXECUTE supports.
long_name: Legal values of mcontrol6.EXECUTE
schema:
  type: array
  items:
    type: integer
    enum:
      - 0
      - 1
  maxItems: 2
  minItems: 1
  uniqueItems: true
requirements:
  idl(): |
    -> $array_includes?(SDTRIG_MCONTROL6_EXECUTE_LEGAL_VALUES, 0);
  reason: The reset value of mcontrol6.execute is 0, so 0 must be a legal value.
definedBy:
  allOf:
    - extension:
        name: Sdtrig
    - param:
        name: SDTRIG_MCONTROL6_SUPPORTED_TRIGGERS
        includes: true
        reason: Only relevant if at least one trigger supports mcontrol6.
