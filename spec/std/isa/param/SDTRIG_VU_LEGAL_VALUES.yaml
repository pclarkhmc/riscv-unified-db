# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SDTRIG_VU_LEGAL_VALUES
description: |
  The set of values that the VU field supports in every trigger type that has one (mcontrol, mcontrol6, icount, itrigger, etrigger).
long_name: Legal values of the trigger VU bit
schema:
  type: array
  items:
    type: integer
    enum:
      - 0
      - 1
  maxItems: 2
  minItems: 1
  uniqueItems: true
requirements:
  idl(): |
    -> $array_includes?(SDTRIG_VU_LEGAL_VALUES, 0);
  reason: The reset value of the VU field is 0, so 0 must be a legal value.
definedBy:
  extension:
    allOf:
      - name: Sdtrig
      - name: H
